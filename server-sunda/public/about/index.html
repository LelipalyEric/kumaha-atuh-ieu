<!DOCTYPE html>
<html lang="su">
<head>
  <meta charset="UTF-8">

  <title>Perkawis Sim Kuring - Paguyuban E</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
    }

    nav {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }

    nav h1 {
      margin: 0;
    }

    nav ul {
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      color: silver;
      text-decoration: none;
    }

    nav div {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    nav img {
      width: 40px;
      height: 40px;
      object-fit: cover;
    }

    main {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: calc(100vh - 60px);
    }

    main div {
      position: relative;
    }

    main img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    main section {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4rem 1rem 1rem;
      background: linear-gradient(to top, black, transparent);
    }

    blockquote {
      margin: 0;
    }
  </style>
</head>

    </div>
